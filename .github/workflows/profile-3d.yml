name: GitHub Profile - 3D Contributions and Project Cards

on:
  # Make the 3D graph automatically on the first push of this README/workflow.
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-3d.yml
      - scripts/generate_cards.py
  schedule:
    # 03:30 IST = 22:00 UTC (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate real GitHub 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Verify expected 3D SVG was generated
        run: |
          if [ ! -s profile-3d-contrib/profile-night-view.svg ]; then
            echo 'ERROR: profile-night-view.svg is missing or empty. Check the 3D action logs.' >&2
            exit 1
          fi
          echo '3D contribution SVG exists.'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh repository cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py

      - name: Commit generated SVG files (never force push)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- profile-3d-contrib assets/project-cards
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh 3D contributions and project cards'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'No visual changes to commit.'
          fi
