name: GitHub Profile - 3D Contributions and Project Cards

on:
  schedule:
    # 03:30 IST (India) = 22:00 UTC, previous calendar day
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-profile-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh repository cards from public GitHub metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_cards.py

      - name: Commit generated SVG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile-3d-contrib/ assets/project-cards/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh 3D contributions and project cards'
            git push
          else
            echo 'No changes to commit.'
          fi
